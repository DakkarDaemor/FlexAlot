<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FlexAlot">
  <meta name="theme-color" content="#4f46e5">
  <title>FlexAlot</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">

  <!-- ── Title bar ─────────────────────────────────────────────────────── -->
  <div id="title-bar" class="title-bar">
    <span class="title-bar-name">FlexAlot</span>
    <button class="title-bar-sync" id="sync-btn" aria-label="Sincronizza dispositivi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-7.5-4M3 12a9 9 0 0 1 9-9 9 9 0 0 1 7.5 4"/>
        <path d="M21 3v5h-5M3 21v-5h5"/>
      </svg>
      <span class="sync-dot" id="sync-dot" hidden></span>
    </button>
  </div>

  <!-- ── Calendar View ──────────────────────────────────────────────────── -->
  <div id="view-calendar" class="view active">

    <header class="app-header">
      <button class="btn-icon" id="prev-month" aria-label="Mese precedente">&#8249;</button>
      <h1 id="month-title">Caricamento…</h1>
      <button class="btn-icon" id="next-month" aria-label="Mese successivo">&#8250;</button>
    </header>

    <div id="stats-bar" class="stats-bar" aria-label="Riepilogo mensile"></div>

    <div class="calendar-container">
      <div class="weekday-headers">
        <div class="wday">Lun</div>
        <div class="wday">Mar</div>
        <div class="wday">Mer</div>
        <div class="wday">Gio</div>
        <div class="wday">Ven</div>
        <div class="wday we">Sab</div>
        <div class="wday we">Dom</div>
      </div>
      <div id="days-grid" class="days-grid"></div>
    </div>

  </div>

  <!-- ── Archive View ───────────────────────────────────────────────────── -->
  <div id="view-archive" class="view">

    <header class="app-header">
      <h1>Archivio</h1>
      <button class="btn-icon" id="import-btn" aria-label="Importa JSON">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12m0-12 4 4m-4-4L8 7"/>
          <path d="M2 17l.621 2.485A2 2 0 004.561 21h14.878a2 2 0 001.94-1.515L22 17"/>
        </svg>
      </button>
      <input type="file" id="import-file" accept=".json,application/json" style="display:none">
      <button class="btn-icon" id="export-btn" aria-label="Esporta JSON">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 15V3m0 12-4-4m4 4 4-4"/>
          <path d="M2 17l.621 2.485A2 2 0 004.561 21h14.878a2 2 0 001.94-1.515L22 17"/>
        </svg>
      </button>
    </header>

    <div id="archive-list" class="archive-list"></div>

  </div>

  <!-- ── Bottom Navigation ─────────────────────────────────────────────── -->
  <nav class="bottom-nav" aria-label="Navigazione principale">
    <button class="nav-btn active" data-view="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <path d="M16 2v4M8 2v4M3 10h18"/>
      </svg>
      <span>Calendario</span>
    </button>
    <button class="nav-btn" data-view="archive">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 8v13H3V8M23 3H1v5h22V3zM10 12h4"/>
      </svg>
      <span>Archivio</span>
    </button>
  </nav>

</div>

<!-- ── Day Edit Modal ───────────────────────────────────────────────────── -->
<div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <h2 id="modal-title"></h2>
    <div id="modal-body" class="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn-cancel">Annulla</button>
      <button id="modal-save"   class="btn-save">Salva</button>
    </div>
  </div>
</div>

<!-- ── Sync Modal ───────────────────────────────────────────────────────── -->
<div id="sync-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="sync-modal-title">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <h2 id="sync-modal-title">Sincronizza dispositivi</h2>
    <div class="modal-body">
      <p class="sync-desc">Scegli una passphrase. Usando la stessa su più dispositivi vedrai sempre gli stessi dati. Non è un login: la passphrase serve solo a etichettare i tuoi dati sul cloud.</p>
      <input type="password" id="sync-pass" class="sync-input" placeholder="Passphrase" autocomplete="off" autocapitalize="off" spellcheck="false">
      <p class="sync-hint" id="sync-hint"></p>
    </div>
    <div class="modal-actions">
      <button id="sync-cancel" class="btn-cancel">Annulla</button>
      <button id="sync-connect" class="btn-save">Sincronizza</button>
    </div>
    <button id="sync-disconnect" class="btn-disconnect" hidden>Disconnetti (solo locale)</button>
  </div>
</div>

<script src="js/holidays.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script type="module" src="js/sync.js"></script>
</body>
</html>
